<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<!-- Visual grammar after diagram-design (MIT, Cathryn Lavery), github.com/cathrynlavery/diagram-design. Licence: scripts/architecture/LICENSE.diagram-design -->
<title>{{TITLE}} architecture</title>
<style>
/* Theme: every colour comes from these variables, so the host (Bree) can override them on :root. Fallbacks are Bree's dark overlay surface. */
:root{
  --paper:#262624;--paper-2:#2f2f2c;--ink:#ECEBE6;--muted:#A8A69F;--soft:#85837D;--grid-dot:rgba(245,245,245,.10);
  --rule:rgba(236,235,230,.12);--rule-solid:rgba(236,235,230,.26);
  --accent:#F5F4EE;--accent-tint:rgba(245,244,238,.08);
  --serif:ui-serif,"New York",Georgia,serif;--sans:-apple-system,"SF Pro Text",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:13px var(--sans);-webkit-user-select:none;user-select:none}
header{position:relative;flex:none;padding:6px 16px 8px;min-width:0}  /* 16 px content inset, like the host's segmented control */
#eyb{display:flex;gap:10px;align-items:baseline;min-width:0;height:16px;overflow:hidden;white-space:nowrap;font:11.5px var(--mono);letter-spacing:.08em;color:var(--muted)}
/* chrome labels are uppercased with the document language (html lang from D.lang), so tr gets i -> İ and en never does; board content is never uppercased */
#eyb span:first-child{text-transform:uppercase}
#eyb #ag{letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;align-items:center;gap:10px;min-width:0;height:32px}
#step[hidden],#zoom[hidden],#empty[hidden],#lead[hidden]{display:none}
#step{flex:none;display:flex;align-items:center;gap:2px;border:1px solid var(--rule-solid);border-radius:8px;background:var(--rule);padding:2px}
#step button{min-width:28px;height:26px;padding:0 6px;font-size:16px;line-height:1}
#step button:disabled{opacity:.35;cursor:default}
#pos{min-width:44px;text-align:center;color:var(--ink);font:12.5px var(--mono)}
h1{flex:1 1 auto;min-width:0;margin:0;font:600 15px/1 var(--sans)}
#toc{display:flex;align-items:center;gap:6px;max-width:100%;color:var(--ink);font:600 15px var(--sans);padding:4px 8px;margin-left:-8px}
#toc span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toc::after{content:"";flex:none;width:6px;height:6px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:translateY(-2px) rotate(45deg)}
#toc[aria-expanded=true]::after{transform:translateY(1px) rotate(-135deg)}
#purpose{margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.4;-webkit-user-select:text;user-select:text}
#contents{position:absolute;z-index:8;left:16px;top:58px;width:min(440px,calc(100% - 32px));max-height:min(70vh,520px);overflow:auto;padding:6px;background:var(--paper-2);border:1px solid var(--rule-solid);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#contents[hidden]{display:none}
#contents .sec{padding:8px 8px 4px;color:var(--muted);font:12px var(--mono);letter-spacing:.08em;text-transform:uppercase}
#contents .it{display:flex;gap:10px;width:100%;text-align:left;padding:5px 8px;color:var(--ink);font-size:13px;border-radius:6px}
#contents .it i{flex:none;min-width:18px;color:var(--muted);font:12px var(--mono);font-style:normal;text-align:right}
#contents .sec.tg{display:flex;width:100%;text-align:left;border-radius:6px;cursor:pointer;color:var(--muted)}
#contents .sec.tg::after{content:"";margin-left:auto;align-self:center;width:6px;height:6px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:translateY(-2px) rotate(45deg)}
#contents .sec.tg[aria-expanded=true]::after{transform:translateY(1px) rotate(-135deg)}
#contents .it[hidden]{display:none}
#contents .it:hover{background:var(--rule)}
#contents .it[aria-current=true]{background:var(--accent-tint);box-shadow:inset 2px 0 var(--accent)}
button{font:inherit;color:var(--muted);background:none;border:1px solid transparent;border-radius:6px;padding:3px 10px;cursor:pointer}
button:hover{color:var(--ink)}
button:focus-visible,.node:focus-visible rect{outline:2px solid var(--accent);outline-offset:1px}
#wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 0;min-width:0;min-height:0;overflow:hidden;touch-action:none;cursor:grab;border-top:1px solid var(--rule)}
#stage.drag{cursor:grabbing}
#view{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
/* geometricPrecision: with the default hinting Chrome lays text out at one size and paints it at another once #view is scaled, so names drift out of their boxes */
.b svg{display:block;text-rendering:geometricPrecision}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--gf,1);background-image:radial-gradient(circle,var(--grid-dot) .9px,transparent 1.2px);background-size:var(--gs,22px) var(--gs,22px);background-position:var(--gx,0) var(--gy,0)}
#zoom{position:absolute;right:12px;bottom:12px;z-index:4;display:flex;gap:2px;font-variant-numeric:tabular-nums;background:var(--paper-2);border:1px solid var(--rule-solid);border-radius:8px;padding:2px}
#zoom button{min-width:28px;height:28px;padding:0 6px;font:12px var(--sans);font-variant-numeric:tabular-nums}
#zoom #zl{min-width:48px;cursor:default;color:var(--ink)}
/* node info card: a small box in the stage, anchored beside the selected node with an arrow; it never resizes the stage and never changes the zoom */
#card{position:absolute;z-index:6;left:0;top:0;width:300px;display:flex;flex-direction:column;background:var(--paper-2);border:1px solid var(--rule-solid);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);color:var(--ink);font-size:13.5px;line-height:1.5;cursor:default;-webkit-user-select:text;user-select:text}
#card[hidden]{display:none}
#card .arw{position:absolute;width:10px;height:10px;background:var(--paper-2);border:0 solid var(--rule-solid);transform:rotate(45deg);pointer-events:none}
#card.s-right .arw{left:-6px;border-width:0 0 1px 1px}
#card.s-left .arw{right:-6px;border-width:1px 1px 0 0}
#card.s-below .arw{top:-6px;border-width:1px 0 0 1px}
#card.s-above .arw{bottom:-6px;border-width:0 1px 1px 0}
#card.docked .arw{display:none}
/* docked in a stage corner (no side clears the neighbours): a thin leader line links the card to its node */
#lead{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;overflow:visible}
#lead line{stroke:var(--accent);stroke-width:1;opacity:.8}#lead circle{fill:var(--accent)}
#empty{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:24px;text-align:center;font-size:13px;color:var(--muted);pointer-events:none}
#empty p{margin:0}#empty .when{color:var(--soft)}
#card .hd{flex:none;display:flex;align-items:flex-start;gap:6px;padding:10px 8px 6px 12px}
#card .hd>div{flex:1;min-width:0}
#card .bk{display:block;max-width:100%;margin:-2px 0 2px -8px;padding:1px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font-size:13px}
#card .bd{flex:1 1 auto;min-height:0;overflow:auto;padding:0 12px 6px;scrollbar-width:thin;scrollbar-color:var(--soft) transparent}
#card .bd::-webkit-scrollbar{width:8px}#card .bd::-webkit-scrollbar-thumb{background:var(--soft);border-radius:4px;border:2px solid var(--paper-2)}
#card .bd.mb{-webkit-mask-image:linear-gradient(#000 calc(100% - 24px),transparent);mask-image:linear-gradient(#000 calc(100% - 24px),transparent)}
#card .ft{flex:none;padding:6px 12px 8px;border-top:1px solid var(--rule);background:var(--paper-2);border-radius:0 0 10px 10px}
#card .nmx{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
#card .kd{display:inline-block;margin-left:8px;padding:0 6px;border:1px solid var(--soft);border-radius:3px;color:var(--muted);font:13px var(--mono);vertical-align:1px}
#card .x{flex:none;display:flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;margin:0;border:0;background:none}
#card .x:hover{background:var(--rule)}
#card .xm{position:relative;width:11px;height:11px}  /* the xmark glyph: two bars */
#card .xm::before,#card .xm::after{content:"";position:absolute;left:0;top:5px;width:11px;height:1.5px;border-radius:1px;background:currentColor;transform:rotate(45deg)}
#card .xm::after{transform:rotate(-45deg)}
#card .det{margin:0 0 6px;font-size:14px;font-weight:500;line-height:1.45}
#card .clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
#card:not(.exp) .xo,#card.exp .xc{display:none}
#card h3{margin:10px 0 4px;color:var(--muted);font:13px var(--mono);letter-spacing:.08em;text-transform:uppercase}  /* chrome label: uppercase follows <html lang> */
#card.exp .clamp{display:block;-webkit-line-clamp:unset}
#card p{margin:0}
#card ul{margin:0;padding:0;list-style:none}
#card li{margin:2px 0}
#card .m{color:var(--muted);margin-top:6px}
#card a{color:var(--ink);font:13px var(--mono);overflow-wrap:anywhere}
#card button{border-color:var(--rule-solid);margin:4px 4px 0 0;font-size:13px}
#card .cn{display:block;width:100%;margin:0;text-align:left;color:var(--ink);border-color:transparent;padding:4px 8px;margin-left:-8px;width:calc(100% + 16px)}
#card .cn:hover{background:var(--rule)}
#card .cn b{color:var(--muted);font:13px var(--mono);font-weight:400;margin-right:6px}
#card .cn em{color:var(--muted);font-style:normal;margin-right:6px}
#card .watch{padding:6px 10px;border-left:2px solid var(--muted);background:var(--accent-tint)}
#card .unv{margin-top:12px;color:var(--muted);font-style:italic}
.node{cursor:pointer;outline:none}
.node:hover .nb,.node:focus-visible .nb{stroke-width:2}
.node.sel .nb{stroke:var(--accent);stroke-width:2}
/* with a selection the focal node keeps its heavier fill but drops to the normal stroke: one strong outline at a time */
.has-sel .node:not(.sel) .nb.focal{stroke-width:1}
/* focus with context: the selected node, its neighbours and the edges between them stay at full contrast; the rest dims */
.has-sel path.ed:not(.on){opacity:.4}
/* dimming touches the box only (fill and stroke), never the text: node text keeps its full contrast on the paper */
.has-sel .node:not(.sel):not(.nbr) .nb{fill-opacity:.4;stroke-opacity:.4}
@media (prefers-reduced-motion:no-preference){.nb,path.ed{transition:fill-opacity .15s,stroke-opacity .15s,opacity .15s}}
/* svg classes */
.mask{fill:var(--paper)}
.nb{fill:color-mix(in srgb,var(--ink) 6%,var(--paper));stroke:var(--ink)}
/* the focal node (entry / the one thing) is a heavier neutral box with a small tag: the accent colour is reserved for the selection */
.nb.focal{fill:color-mix(in srgb,var(--ink) 13%,var(--paper));stroke:var(--ink);stroke-width:2.4}
.nb.store{fill:color-mix(in srgb,var(--ink) 5%,transparent);stroke:var(--muted)}
.hit{fill:transparent;stroke:none}
.nm{fill:var(--ink);font-family:var(--sans)}
.sb{fill:var(--muted);font-family:var(--mono)}
.eb{fill:var(--muted);font-family:var(--mono);letter-spacing:.08em}
.al{fill:var(--muted);font-family:var(--mono);letter-spacing:.08em}
.lg{fill:var(--muted);font-family:var(--sans)}
.tag{fill:none;stroke:var(--soft)}
.tg{fill:var(--muted);font-family:var(--mono);letter-spacing:.08em}
.ed{fill:none;stroke:var(--muted)}
.ar{fill:var(--muted)}
.dg{fill:none;stroke:var(--muted)}
.l1{stroke:var(--rule)}.l2{stroke:var(--rule-solid)}
.band{fill:color-mix(in srgb,var(--ink) 4%,transparent)}
.zone{fill:color-mix(in srgb,var(--ink) 3%,transparent);stroke:var(--rule-solid)}
</style></head>
<body>
<header>
<div id="eyb"><span id="eb"></span><span id="ag"></span></div>
<div class="bar">
<div id="step" role="group" aria-label="Reading order" data-sa="reading_order"><button id="pv" title="Previous diagram ([)" aria-label="Previous diagram" data-st="prev_title" data-sa="prev">&lsaquo;</button><span id="pos" aria-live="polite"></span><button id="nx" title="Next diagram (])" aria-label="Next diagram" data-st="next_title" data-sa="next">&rsaquo;</button></div>
<h1><button id="toc" aria-expanded="false" aria-controls="contents" title="Contents" data-st="contents"><span id="ttl"></span></button></h1></div>
<p id="purpose"></p>
<div id="contents" hidden></div>
</header>
<div id="wrap"><main id="stage"><div id="view"><!--BOARDS--></div>
<aside id="card" hidden aria-label="Node details" data-sa="node_details"></aside>
<svg id="lead" hidden aria-hidden="true"><line x1="0" y1="0" x2="0" y2="0"/><circle r="3" cx="0" cy="0"/></svg>
<div id="empty" hidden><p class="msg"></p><p class="when"></p></div>
<div id="zoom" role="group" aria-label="Zoom" data-sa="zoom"><button id="zf" title="Fit to view (Cmd 0, double-click)" aria-label="Fit to view" data-st="fit_title" data-sa="fit_aria" data-s="fit">Fit</button><button id="zo" title="Zoom out (Cmd -)" aria-label="Zoom out" data-st="zoom_out_title" data-sa="zoom_out">&minus;</button><button id="zl" tabindex="-1" aria-label="Zoom level" title="Zoom level (Cmd 1 = 100%)" data-st="zoom_level_title" data-sa="zoom_level">100%</button><button id="zi" title="Zoom in (Cmd =)" aria-label="Zoom in" data-st="zoom_in_title" data-sa="zoom_in">+</button></div></main>

<script>
const D = /*DATA*/;
/* Chrome strings: one table. The host may set window.breeStrings (any subset) before this script runs; these are the English defaults. Board content is the producer's language (D.lang). */
const S = Object.assign({
  reading_order: "Reading order", prev: "Previous diagram", prev_title: "Previous diagram ([)", next: "Next diagram", next_title: "Next diagram (])",
  contents: "Contents", node_details: "Node details", zoom: "Zoom", fit: "Fit", fit_aria: "Fit to view", fit_title: "Fit to view (Cmd 0, double-click)",
  zoom_out: "Zoom out", zoom_out_title: "Zoom out (Cmd -)", zoom_level: "Zoom level", zoom_level_title: "Zoom level (Cmd 1 = 100%)", zoom_in: "Zoom in", zoom_in_title: "Zoom in (Cmd =)",
  back_to: "Back to {name}", close_aria: "Close card (Esc)", close_title: "Close (Esc)", more: "More", less: "Less",
  what: "What it does", why: "Why it exists", code: "In the code", watch: "Watch out", links: "Connections", flows: "Flows", lane: "Lane",
  unverified: "Unverified: this node's code link could not be checked.", wiki: "Wiki", agent_wrote: "Written by agent", changes: "Changes", last_generated: "Last generated", legend: "Legend"
}, window.breeStrings || {});
document.documentElement.lang = D.lang || "en";
const UL = S._lang || "en";  // chrome elements carry the UI language; content keeps the document language (<html lang>)
document.querySelectorAll("[data-st],[data-sa],[data-s]").forEach(e => e.lang = UL);
document.querySelectorAll("[data-st]").forEach(e => e.title = S[e.dataset.st]);
document.querySelectorAll("[data-sa]").forEach(e => e.setAttribute("aria-label", S[e.dataset.sa]));
document.querySelectorAll("[data-s]").forEach(e => e.textContent = S[e.dataset.s]);
document.querySelectorAll("svg text[data-sl]").forEach(e => {e.textContent = S[e.dataset.sl].toLocaleUpperCase(UL); e.lang = UL;});  // the legend eyebrow
const card = document.getElementById("card"), lead = document.getElementById("lead"), stage = document.getElementById("stage"), view = document.getElementById("view"), toc = document.getElementById("toc"), contents = document.getElementById("contents");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MIN = 0.25, MAX = 2.5, FIT_MAX = 1, PAD = 16, TEXT_PX = 10;  // the smallest text of a board should stay >= 10 px on screen at open; Fit never zooms above 100%; the fit pad keeps a board clear of the stage edge
const CHANGES = "delta";  // the Changes tab loads current.html#delta: that board is not part of the Current list and never touches the saved place
let blank = false, dock = null, cur = null, st = {s: 1, tx: 0, ty: 0, fit: true}, fitS = 1, gest = null, drag = null, swallow = false, sel = null, anim = 0;
const ORDER = D.groups.flatMap(g => g.boards);  // reading order: the groups in nav order, boards in their order inside a group
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
/* where the reader was, per repo: board, zoom/pan per board, selected node. Restored on reopen (localStorage may be unavailable: then nothing is kept). */
const KEY = "bree-arch:" + D.repo;
let P = {board: null, views: {}, sel: null, exp: false}, saveT = 0;
try {P = Object.assign(P, JSON.parse(localStorage.getItem(KEY) || "{}"));} catch (_) {}
function remember(){
  clearTimeout(saveT); if (!cur || cur === CHANGES) return;
  P.board = cur; P.views[cur] = {s: st.s, tx: st.tx, ty: st.ty, fit: st.fit, home: !!st.home, user: !!st.user}; P.sel = sel; P.exp = exp;
  try {localStorage.setItem(KEY, JSON.stringify(P));} catch (_) {}
}
const later = () => {clearTimeout(saveT); saveT = setTimeout(remember, 150);};
addEventListener("pagehide", remember);
function link(s, sym){return '<a href="'+esc(s.path)+'#L'+(s.line||1)+'">'+(sym ? esc(sym)+' \u00b7 '+esc(s.path) : esc(s.label||s.path))+(s.line?':'+s.line:'')+'</a>';}
/* host bridge: code links are plain link activations (the app resolves them); other messages go to a message handler when the host has one,
   and as a link activation of bree-bridge:<json> otherwise. */
function postBridge(msg){
  if (window.__bridgeLog) window.__bridgeLog.push(msg);
  const h = window.webkit && webkit.messageHandlers && webkit.messageHandlers.bree;
  if (h) h.postMessage(msg);
  const a = document.createElement("a"); a.href = "bree-bridge:" + encodeURIComponent(JSON.stringify(msg)); a.click();
}
/* ---- node info card: a box beside the selected node (right, left, below or above, whichever fits and covers the fewest neighbours); the zoom is never touched ---- */
const nodeEl = id => document.querySelector('#b-'+cur+' .node[data-id="'+CSS.escape(id)+'"]');
const edgesOf = id => [...document.querySelectorAll('#b-'+cur+' path.ed')].filter(p => p.dataset.from === id || p.dataset.to === id);
function neighbours(id){
  const nb = new Set();
  document.querySelectorAll('#b-'+cur+' path.ed').forEach(p => {if (p.dataset.from === id) nb.add(p.dataset.to); if (p.dataset.to === id) nb.add(p.dataset.from);});
  nb.delete(id); return nb;
}
/* the stage changed size (window resized): keep the opening view or the fit, else keep the user's view inside the new box */
function relayout(){
  if (blank) return;
  fitS = fitScale();
  if (st.home) openView(); else if (st.fit) fitView(); else {clampPan(); apply();}
  if (sel) chooseSide(false);
}
function stopAnim(){cancelAnimationFrame(anim);}
/* pan (never zoom) to a target translation; animated 220 ms unless the reader asked for reduced motion */
function panTo(tx, ty){
  stopAnim();
  const from = {tx: st.tx, ty: st.ty};
  st.fit = st.home = false; st.tx = tx; st.ty = ty; clampPan();
  const to = {tx: st.tx, ty: st.ty};
  if (reduce.matches || Math.hypot(to.tx - from.tx, to.ty - from.ty) < 2) {apply(); return;}
  const t0 = performance.now();
  st.tx = from.tx; st.ty = from.ty;
  const tick = now => {
    const k = Math.min(1, (now - t0)/220), e = 1 - Math.pow(1 - k, 3);
    st.tx = from.tx + (to.tx - from.tx)*e; st.ty = from.ty + (to.ty - from.ty)*e; apply();
    if (k < 1) anim = requestAnimationFrame(tick);
  };
  anim = requestAnimationFrame(tick);
}
/* bring a node into the stage: centre it when forced or when it is not fully inside with a 24 px margin */
function reveal(id, force){
  const g = nodeEl(id); if (!g) return;
  const s = stage.getBoundingClientRect(), r = g.getBoundingClientRect(), M = 24;
  if (!force && r.left >= s.left + M && r.right <= s.right - M && r.top >= s.top + M && r.bottom <= s.bottom - M) return;
  panTo(st.tx + ((s.left + s.right) - (r.left + r.right))/2, st.ty + ((s.top + s.bottom) - (r.top + r.bottom))/2);
}
const GAP = 12, EDGE = 8, SIDES = ["right", "left", "below", "above"], CORNERS = ["tl", "tr", "bl", "br"];
const cornerSpot = (k, w, h, SW, SH) => ({x: k[1] === "l" ? EDGE : SW - EDGE - w, y: k[0] === "t" ? EDGE : SH - EDGE - h});
let side = "right";
/* a node's box in stage coordinates */
function boxOf(id){
  const e = nodeEl(id); if (!e) return null;
  const r = e.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return {l: r.left - s.left, t: r.top - s.top, r: r.right - s.left, b: r.bottom - s.top};
}
const hits = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;
const clampTo = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
/* where the card sits for a side, given the node box and the card size, inside the stage */
function spot(sd, nb, w, h, SW, SH){
  const cx = (nb.l + nb.r)/2, cy = (nb.t + nb.b)/2;
  if (sd === "right") return {x: nb.r + GAP, y: clampTo(cy - h/2, EDGE, SH - EDGE - h)};
  if (sd === "left") return {x: nb.l - GAP - w, y: clampTo(cy - h/2, EDGE, SH - EDGE - h)};
  if (sd === "below") return {x: clampTo(cx - w/2, EDGE, SW - EDGE - w), y: nb.b + GAP};
  return {x: clampTo(cx - w/2, EDGE, SW - EDGE - w), y: nb.t - GAP - h};
}
/* Placement. Obstacles that must stay visible and uncovered: the selected node, its direct neighbours and the labels on the edges between them (so "focus with context"
   keeps its context); the legend and the zoom control must stay uncovered. Non-neighbour nodes may be covered or panned away. Every side is tried with every pan on a
   12 px grid (zoom never changes, pan limited by clampPan); the winner has the fewest violations, then the smallest pan, then the order right/left/below/above.

   A key press the page already handled is remembered for a moment, so the host calling this for the same press still gets true. */
let escMemo = null;
function handleEscape(){
  if (!contents.hidden) {setContents(false); toc.focus(); return true;}
  if (sel) {closeCard(); return true;}
  return false;
}
window.breeHandleEscape = () => {
  if (escMemo && performance.now() - escMemo.t < 250) {const r = escMemo.r; escMemo = null; return r;}
  return handleEscape();
};
/* arrow keys on a focused node move to the connected node that lies in that direction */
function nodeInDir(id, key){
  const c = e => {const r = e.getBoundingClientRect(); return [(r.left + r.right)/2, (r.top + r.bottom)/2];};
  const [x, y] = c(nodeEl(id)), v = {ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1]}[key];
  let best = null, fallback = null;
  neighbours(id).forEach(i => {
    const e = nodeEl(i); if (!e) return;
    const [px, py] = c(e), dx = px - x, dy = py - y, d = Math.hypot(dx, dy) || 1, cos = (dx*v[0] + dy*v[1])/d;
    if (cos <= 0) return;
    const score = d/cos;
    if (cos >= 0.35 && (!best || score < best.score)) best = {i, score};
    if (!fallback || d < fallback.score) fallback = {i, score: d};
  });
  return (best || fallback || {}).i;
}
addEventListener("keydown", e => {
  if (e.key === "Escape") {const r = handleEscape(); escMemo = {t: performance.now(), r}; if (r) e.preventDefault(); return;}
  /* [ and ] also with Option held: the Turkish layout types them as Option+8 / Option+9 (e.key is already the bracket) */
  if (!(e.metaKey || e.ctrlKey)) {
    if (e.key === "[") {e.preventDefault(); stepBoard(-1); return;}
    if (e.key === "]") {e.preventDefault(); stepBoard(1); return;}
  }
  if (!(e.metaKey || e.ctrlKey) && !e.altKey) {
    const g = e.target.closest && e.target.closest(".node");
    if (g && e.key.startsWith("Arrow")) {
      const t = nodeInDir(g.dataset.id, e.key);
      if (t) {e.preventDefault(); nodeEl(t).focus({preventScroll: true}); if (sel) selectNode(t); else reveal(t, false);}
      return;
    }
    /* no node selected: the arrows switch boards (the user's Turkish layout reaches [ ] only through Option) */
    if (!sel && !g && !e.shiftKey && (e.key === "ArrowLeft" || e.key === "ArrowRight") && !(e.target.closest && e.target.closest("#contents"))) {e.preventDefault(); stepBoard(e.key === "ArrowLeft" ? -1 : 1); return;}
  }
  if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
  if (e.key === "=" || e.key === "+") {e.preventDefault(); step(1.25);}
  else if (e.key === "-" || e.key === "_") {e.preventDefault(); step(0.8);}
  else if (e.key === "0") {e.preventDefault(); fitView();}
  else if (e.key === "1") {e.preventDefault(); step(1/st.s);}
});
new ResizeObserver(() => {if (cur) relayout();}).observe(stage);
/* ---- boards ---- */
function open(id, restore){
  if(!D.boards[id]) return;
  closeCard(); stopAnim(); setContents(false);
  cur = id; location.hash = id;
  document.querySelectorAll(".b").forEach(x=>x.hidden = x.id !== "b-"+id);
  const i = ORDER.indexOf(id), bd = D.boards[id], ch = id === CHANGES;
  contents.querySelectorAll(".it").forEach(b => b.setAttribute("aria-current", b.dataset.b === id ? "true" : "false"));
  document.getElementById("step").hidden = ch;
  document.getElementById("pos").textContent = ch ? "" : (i + 1)+" / "+ORDER.length;
  document.getElementById("pv").disabled = i <= 0; document.getElementById("nx").disabled = i >= ORDER.length - 1;
  document.getElementById("ttl").textContent = bd.title;
  document.getElementById("purpose").textContent = bd.purpose;
  const eb = document.getElementById("eb"); eb.textContent = ch ? S.changes : bd.group; if (ch) eb.lang = UL; else eb.removeAttribute("lang");  // uppercase follows <html lang>
  document.getElementById("ag").lang = UL; document.getElementById("ag").textContent = bd.agent && D.agent ? S.agent_wrote + " \u00b7 " + D.agent.at : "";
  /* a board with no diagram (svg.empty) shows an HTML message and no zoom control; the Changes tab has no pager either */
  blank = svgOf().classList.contains("empty");
  view.hidden = blank; document.getElementById("zoom").hidden = blank;
  const em = document.getElementById("empty"); em.hidden = !blank;
  if (blank) {em.querySelector(".msg").textContent = svgOf().dataset.msg || ""; const w = em.querySelector(".when"); w.lang = UL; w.textContent = D.agent ? S.last_generated + ": " + D.agent.at : ""; w.hidden = !D.agent;}
  openView();
  if (restore && !ch && !blank) {  // same board as when the page was last left: the selection first, then the saved view. A board the reader never zoomed or panned stays at Fit.
    const same = P.board === id, v = P.views[id];
    if (same && P.sel && D.info[P.sel] && nodeEl(P.sel)) selectNode(P.sel, {keep: true, expanded: !!P.exp});
    if (v && !v.home && v.s > 0 && (v.user || (same && P.sel))) {st = {s: v.s, tx: v.tx, ty: v.ty, fit: !!v.fit, user: !!v.user}; clampPan(); apply();}
    if (sel) chooseSide(false);
  }
  remember();
}
D.groups.forEach(g => {
  const fold = D.facts && g.name === D.facts;  // the deterministic boards sit under one collapsed "Facts" row
  let h;
  if (fold) {h = document.createElement("button"); h.className = "sec tg"; h.setAttribute("aria-expanded", "false"); h.textContent = g.name+" \u00b7 "+g.boards.length; h.onclick = () => setFacts(!factsOpen);}
  else {h = document.createElement("div"); h.className = "sec"; h.textContent = g.name;}
  contents.appendChild(h);
  g.boards.forEach(id => {const b = document.createElement("button"); b.className = "it" + (fold ? " fx" : ""); b.hidden = !!fold; b.dataset.b = id; b.innerHTML = "<i>"+(ORDER.indexOf(id) + 1)+"</i><span>"+esc(D.boards[id].title)+"</span>"; b.onclick = () => {open(id); toc.focus();}; contents.appendChild(b);});
});
toc.onclick = () => setContents(contents.hidden);
document.getElementById("pv").onclick = () => stepBoard(-1);
document.getElementById("nx").onclick = () => stepBoard(1);
addEventListener("click", e => {if (!contents.hidden && !e.target.closest("#contents") && !e.target.closest("#toc")) setContents(false);});
stage.addEventListener("click", e=>{
  if (swallow || e.target.closest("#zoom") || e.composedPath().includes(card)) return;  // composedPath: a card button may already be gone from the DOM (the card re-renders on click)
  const g = e.target.closest(".node");
  if (!g) {closeCard(); return;}
  if (sel === g.dataset.id) closeCard(); else {hist = []; selectNode(g.dataset.id);}
});
view.addEventListener("keydown", e=>{const g=e.target.closest&&e.target.closest(".node"); if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault(); if (sel === g.dataset.id) closeCard(); else {hist = []; selectNode(g.dataset.id);}}});
view.addEventListener("focusin", e => {const g = e.target.closest && e.target.closest(".node"); if (g && g.matches(":focus-visible")) reveal(g.dataset.id, false);});  // keyboard focus brings the node into the stage
/* a role="img" svg is one AX image: its nodes (role=button) are hidden from assistive tech. As a group, each node is reachable. */
document.querySelectorAll(".b svg").forEach(v => v.setAttribute("role", "group"));
{const h = location.hash.slice(1); open(D.boards[h] ? h : D.boards[P.board] && P.board !== CHANGES ? P.board : ORDER[0], true);}  // first open: diagram 1, the backbone
addEventListener("hashchange", () => {const id = location.hash.slice(1); if (D.boards[id] && id !== cur) open(id);});
</script>
