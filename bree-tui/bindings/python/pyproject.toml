[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bree-sdk"
version = "1.0.0"
description = "Typed Python resource client for bree"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = "MIT"

[project.urls]
Homepage = "https://github.com/ecyx00/bree/tree/main/bree-tui/bindings/python"
Repository = "https://github.com/ecyx00/bree"

[tool.setuptools]
packages = ["bree", "bree.raw", "bree.raw._generated"]

[tool.setuptools.package-data]
bree = ["py.typed"]
