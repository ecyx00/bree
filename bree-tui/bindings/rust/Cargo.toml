[package]
name = "bree-sdk"
version = "1.0.0"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
description = "Typed Rust SDK for the bree terminal multiplexer"
repository = "https://github.com/ecyx00/bree"
homepage = "https://github.com/ecyx00/bree/tree/main/bree-tui/bindings/rust"
publish = true

[lib]
name = "bree"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
libc = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
