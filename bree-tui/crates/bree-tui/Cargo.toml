[package]
name = "bree-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "bree-tui: tmux-like terminal multiplexer TUI backed by libghostty-vt"

[lints]
workspace = true

[features]
default = []
iroh-transport = ["bree-remote/iroh-transport"]

[[bin]]
name = "bree-tui"
path = "src/main.rs"

[[bin]]
name = "bree-tui-hook"
path = "src/bin/bree-tui-hook.rs"

[dependencies]
ghostty-vt.workspace = true
bree-tui-core.workspace = true
bree-tui-cdp.workspace = true
bree-tui-machine-agent-protocol.workspace = true
bree-tui-machine-protocol.workspace = true
ratatui.workspace = true
crossterm.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
bytes.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
base64.workspace = true
getrandom.workspace = true
glob.workspace = true
libc.workspace = true
smallvec.workspace = true
zeroize.workspace = true
terminput.workspace = true
terminput-crossterm.workspace = true
parking_lot.workspace = true
sha2.workspace = true
uuid.workspace = true
wait-timeout.workspace = true

[target.'cfg(unix)'.dependencies]
bree-remote.workspace = true
bree-remote-protocol.workspace = true
bree-wg.workspace = true
tokio.workspace = true
# Machine spend readout: one small JSON GET every few minutes from inside a
# Cloud VM. chatmux-relay already uses reqwest for pairing bootstrap.
reqwest.workspace = true
rustls.workspace = true
url.workspace = true
async-trait.workspace = true

[target.'cfg(windows)'.dependencies]
tokio.workspace = true
windows-sys.workspace = true

[dev-dependencies]
bree-pty.workspace = true
tempfile = "3"
rusqlite.workspace = true
